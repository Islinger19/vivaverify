<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; font-family: "Segoe UI", Roboto, Arial, sans-serif; }
  svg { display: block; margin: 10px; }
  .box { fill: #eef0ff; stroke: #4f46e5; stroke-width: 1.6; }
  .det { fill: #ecfdf3; stroke: #15803d; }
  .hitl { fill: #fff4e5; stroke: #b45309; }
  .ext { fill: #f6f7fb; stroke: #646b85; }
  .pill { fill: #1c2033; }
  .title { font-size: 15px; font-weight: 700; fill: #1c2033; text-anchor: middle; }
  .sub { font-size: 12.5px; fill: #3d4360; text-anchor: middle; }
  .lbl { font-size: 12px; fill: #b45309; font-weight: 600; text-anchor: middle; }
  .lblg { font-size: 12px; fill: #15803d; font-weight: 600; text-anchor: middle; }
  .lbln { font-size: 12px; fill: #3d4360; text-anchor: middle; }
  .white { font-size: 13px; fill: #fff; font-weight: 700; text-anchor: middle; }
  .edge { stroke: #1c2033; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
  .dash { stroke-dasharray: 6 4; }
  .legend { font-size: 12px; fill: #3d4360; }
  .group { fill: none; stroke: #646b85; stroke-width: 1.4; stroke-dasharray: 7 5; }
  .gtitle { font-size: 13px; font-weight: 700; fill: #646b85; }
</style>
</head>
<body>

<!-- 1. Agent workflow (LangGraph) -->
<svg id="workflow" width="820" height="700" viewBox="0 0 820 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c2033"/>
    </marker>
  </defs>

  <rect class="pill" x="365" y="10" width="90" height="34" rx="17"/><text class="white" x="410" y="32">START</text>
  <path class="edge" d="M410,44 V68"/>

  <rect class="box" x="245" y="70" width="330" height="76" rx="10"/>
  <text class="title" x="410" y="94">Planner  (LLM)</text>
  <text class="sub" x="410" y="114">reads the chunked report [C1..Cn], plans 4 questions</text>
  <text class="sub" x="410" y="132">with expected points + evidence chunk ids</text>
  <path class="edge" d="M410,146 V178"/>

  <rect class="box hitl" x="245" y="180" width="330" height="76" rx="10"/>
  <text class="title" x="410" y="204">Examiner  (interrupt)</text>
  <text class="sub" x="410" y="224">asks the question (spoken via TTS) and pauses</text>
  <text class="sub" x="410" y="242">the graph until the student's answer arrives</text>
  <path class="edge" d="M410,256 V288"/>

  <rect class="box" x="245" y="290" width="330" height="76" rx="10"/>
  <text class="title" x="410" y="314">Judge  (guardrails + BM25 + LLM)</text>
  <text class="sub" x="410" y="334">regex guardrails first, then retrieve report chunks,</text>
  <text class="sub" x="410" y="352">LLM scores 0-5: covered / missing / contradictions</text>
  <path class="edge" d="M410,366 V400"/>

  <polygon class="box det" points="410,402 480,442 410,482 340,442" />
  <text class="title" x="410" y="447">Router</text>

  <rect class="box det" x="30" y="410" width="200" height="64" rx="10"/>
  <text class="title" x="130" y="434">Follow-up</text>
  <text class="sub" x="130" y="454">one short question on</text>
  <text class="sub" x="130" y="469">the most important gap</text>
  <path class="edge" d="M340,442 H232"/>
  <text class="lbl" x="286" y="420">score &lt; 3 and</text>
  <text class="lbl" x="286" y="434">no follow-up yet</text>

  <rect class="box det" x="590" y="410" width="200" height="64" rx="10"/>
  <text class="title" x="690" y="434">Next question</text>
  <text class="sub" x="690" y="454">qi + 1, follow-up counter</text>
  <text class="sub" x="690" y="469">reset to 0</text>
  <path class="edge" d="M480,442 H588"/>
  <text class="lbln" x="534" y="420">questions</text>
  <text class="lbln" x="534" y="434">remain</text>

  <path class="edge" d="M130,410 V218 H243"/>
  <path class="edge" d="M690,410 V218 H577"/>
  <text class="lbln" x="130" y="300" transform="rotate(-90 130 300)" dy="-8">ask follow-up</text>
  <text class="lbln" x="690" y="300" transform="rotate(90 690 300)" dy="-8">ask next question</text>

  <path class="edge" d="M410,482 V528"/>
  <text class="lblg" x="470" y="510">all questions done</text>

  <rect class="box det" x="245" y="530" width="330" height="76" rx="10"/>
  <text class="title" x="410" y="554">Reporter  (deterministic)</text>
  <text class="sub" x="410" y="574">percent score, verdict, flags, and the report</text>
  <text class="sub" x="410" y="592">sections to re-read for every weak answer</text>
  <path class="edge" d="M410,606 V630"/>
  <rect class="pill" x="365" y="632" width="90" height="34" rx="17"/><text class="white" x="410" y="654">END</text>

  <rect class="box" x="600" y="560" width="18" height="14" rx="3"/><text class="legend" x="626" y="572">LLM step</text>
  <rect class="box hitl" x="600" y="584" width="18" height="14" rx="3"/><text class="legend" x="626" y="596">human-in-the-loop pause</text>
  <rect class="box det" x="600" y="608" width="18" height="14" rx="3"/><text class="legend" x="626" y="620">no LLM (deterministic)</text>
</svg>

<!-- 2. System architecture -->
<svg id="architecture" width="1000" height="470" viewBox="0 0 1000 470">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c2033"/>
    </marker>
  </defs>
  <style>.edge2 { stroke: #1c2033; stroke-width: 1.6; fill: none; marker-end: url(#arrow2); marker-start: url(#arrow2); }
         .one { marker-start: none; }</style>

  <rect class="box ext" x="20" y="130" width="250" height="170" rx="12"/>
  <text class="title" x="145" y="160">Student's browser</text>
  <text class="sub" x="145" y="184">Frontend: HTML / CSS / JS</text>
  <text class="sub" x="145" y="202">hosted on Vercel</text>
  <text class="sub" x="145" y="230">upload report, hear question,</text>
  <text class="sub" x="145" y="248">answer by mic or keyboard,</text>
  <text class="sub" x="145" y="266">see live agent steps + scorecard</text>

  <rect class="group" x="350" y="40" width="340" height="330" rx="14"/>
  <text class="gtitle" x="366" y="64">VM  -  Dynu DNS hostname, nginx + certbot (HTTPS)</text>

  <rect class="box" x="375" y="80" width="290" height="88" rx="10"/>
  <text class="title" x="520" y="104">FastAPI (uvicorn, 1 worker)</text>
  <text class="sub" x="520" y="126">POST /api/documents · POST /api/voice-token</text>
  <text class="sub" x="520" y="146">WS /ws/viva  (live event stream)</text>

  <rect class="box" x="375" y="188" width="290" height="70" rx="10"/>
  <text class="title" x="520" y="214">LangGraph viva agent</text>
  <text class="sub" x="520" y="236">planner · examiner · judge · router · reporter</text>

  <rect class="box det" x="375" y="278" width="290" height="70" rx="10"/>
  <text class="title" x="520" y="304">Report chunks + BM25 index</text>
  <text class="sub" x="520" y="326">in-memory checkpointer (one thread per viva)</text>

  <rect class="box ext" x="760" y="50" width="225" height="130" rx="12"/>
  <text class="title" x="872" y="78">LLM providers</text>
  <text class="sub" x="872" y="102">1. Gemini (free tier)</text>
  <text class="sub" x="872" y="120">2. OpenRouter free models</text>
  <text class="sub" x="872" y="146">direct OpenAI-compatible calls,</text>
  <text class="sub" x="872" y="164">fallback + 5 min cooldown</text>

  <rect class="box ext" x="760" y="230" width="225" height="120" rx="12"/>
  <text class="title" x="872" y="258">Soniox (real-time)</text>
  <text class="sub" x="872" y="282">STT  stt-rt-v5 (en / hi)</text>
  <text class="sub" x="872" y="300">TTS  tts-rt-v2</text>
  <text class="sub" x="872" y="324">WebSockets</text>

  <path class="edge2" d="M272,150 H373"/>
  <text class="lbln" x="311" y="122">HTTPS</text><text class="lbln" x="311" y="138">+ WSS</text>
  
  <path class="edge2 one" d="M520,168 V186"/>
  <path class="edge2 one" d="M520,258 V276"/>
  <path class="edge2" d="M667,120 H758"/>
  <text class="lbln" x="725" y="110">prompts</text>
  <path class="edge2 one dash" d="M667,155 C730,155 715,290 758,290"/>
  <text class="lbln" x="840" y="210">temporary Soniox keys</text>

  <path class="edge2" d="M145,302 V430 H872 V352"/>
  <text class="lbln" x="510" y="420">audio / speech directly between browser and Soniox over WebSockets (short-lived key)</text>
</svg>
</body>
</html>
